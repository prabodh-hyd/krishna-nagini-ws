<!DOCTYPE html>
<html>
<head>
    <title>jQuery Element Selector</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            // Select all <p> elements and change their text color to red
            $("p").css("color", "red");

            // Select all <div> elements and add a border
            $("div").css("border", "1px solid black");
        });
    </script>
</head>
<body>
    <h1>Welcome to jQuery Element Selector Example</h1>
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>
    <div>This is a div element.</div>
    <div>This is another div element.</div>
</body>
</html>
