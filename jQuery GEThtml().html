<!DOCTYPE html>
<html>
<head>
    <title>jQuery Get html() example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#btn1").click(function(){
                alert($("#demo").html());
            });
        });
    </script>
    <style>
        #demo{
            background: aqua;
            color:black;
            font-size: 20px;
        }
        button{
            background: aqua;
            color:black;
            font-size: 20px;
            text-align: left;
            padding:10px;
        }
    </style>
</head>
<body>
    <p id="demo">This is a <em>demo text.</em> This is another <strong>demo text</strong></p>
    <p>Click for text content</p>
    <button id="btn1">HTML</button>
</body>
</html>
