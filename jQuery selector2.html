<!DOCTYPE html>
<html>
<head>
    <title>jQuery ID Selector</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            // Select the element with id="myId" and change its text color to blue
            $("#myId").css("color", "blue");

            // Select the element with id="anotherId" and change its background color to yellow
            $("#anotherId").css("background-color", "yellow");
        });
    </script>
</head>
<body>
    <h1 id="myId">Hello, World!</h1>
    <p id="anotherId">This is a paragraph with a yellow background.</p>
    <p>This is another paragraph without an ID.</p>
</body>
</html>
