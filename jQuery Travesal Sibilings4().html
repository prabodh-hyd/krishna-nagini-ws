<!DOCTYPE html>
<html>
<head>
    <title>jQuery Traversal Siblings4() example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("p").prev().css({"color":"blue","font-size":"24px", "border":"2px solid red"})     
        });
    </script>
    <style>
        .siblings *{
            display: block;
            border: 2px solid black;
            color:black;
            font-size: 16px;
            padding:7px;
            margin:7px;   
        }
    </style>
</head>
    <body>
        <div class="siblings">
            <div style="width:600px">(PARENTS)
                <h1>h1</h1>
                <p>p</p>
                <h2>h2</h2>
                <ol>ol
                    <li>li</li>
                    <li>li</li>
                </ol>
            </div>
        </div>
    </body>
</html>
