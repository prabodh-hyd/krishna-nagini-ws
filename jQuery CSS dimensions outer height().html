<!DOCTYPE html>
<html>
<head>
    <title>jQuery CSS Properties example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("button").click(function(){
                alert("Font Color="+$("h2").css("color"))
            });     
        });
    </script>
    <style>
        h2{
            color:black;
            background: aqua;
        }
    </style>
    </head>
    <body>
        <h1>KLU</h1>
        <p>This is Krishna</p>

        <h2>Vaddeswaram</h2>
        <p>This is Krishna</p>

        <h2>Vijayawada</h2>
        <p>This is Krishna</p>
        
        <button>Get CSS properties</button>
    </body>
</html>
