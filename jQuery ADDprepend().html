<!DOCTYPE html>
<html>
<head>
    <title>jQuery ADD prepend() example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#btn").click(function(){
                $("h1").prepend("<em>Krishna Nagini</em>");
            });
        });
    </script>
</head>
<body>
    <h1>KLU</h1>
    <p>Prepend</p>
    <button id="btn">PREPEND</button>
</body>
</html>
