<!DOCTYPE html>
<html>
<head>
    <title>jQuery Get val() example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#btn1").click(function(){
                alert($("#ename").val());
            });
            $("#btn2").click(function(){
                alert($("#edept").val());
            });
            $("#btn3").click(function(){
                alert($("#ezone").val());
            });
        });
    </script>
    <style>
        button{
            background: aqua;
            color:black;
            font-size: 20px;
            text-align: left;
            padding:10px;
        }
    </style>
</head>
<body>
    <h2>Employee Details</h2>
    <form>
        <p> Employee Name: <input type="text" id="ename" value="Krishna Nagini"/></p>
        <p >Employee Department: <input type="text" id="edept" value="Web developer"/></p>
        <p > Employee Zone: <input type="text" id="ezone" value="North"/></p>
        <button id="btn1">Employee Name</button>
        <button id="btn2">Employee Department</button>
        <button id="btn3">Employee Zone</button>
    </form>
</body>
</html>
