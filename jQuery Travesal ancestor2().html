<!DOCTYPE html>
<html>
<head>
    <title>jQuery Traversal ancestors parents () example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("span").parentsUntil(div).css({"background":"skyblue","color":"blue","font-size":"24px", "border":"2px solid red"})     
        });
    </script>
    <style>
        .ancestors *{
            display: block;
            border: 2px solid black;
            color:black;
            font-size: 16px;
            padding:7px;
            margin:7px;   
        }
    </style>
</head>
    <body>
        <h1>KLU</h1>
        <div class="ancestors">
            <div style="width:600px">div(great grandparent)
                <ul>ul(grandparent)
                    <li>li(parent)
                        <span>span</span>
                        <span>span</span>
                    </li>
                    <li> li
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
